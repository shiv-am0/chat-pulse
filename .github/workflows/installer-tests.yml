name: Installer tests

on:
  pull_request:
    paths:
      - "docs/install.sh"
      - "docs/install.ps1"
      - "docs/index.html"
      - "docs/vercel.json"
      - "cli/**"
      - ".github/workflows/installer-tests.yml"
  push:
    branches: [master]
    paths:
      - "docs/install.sh"
      - "docs/install.ps1"
      - "docs/index.html"
      - "docs/vercel.json"
      - "cli/**"
      - ".github/workflows/installer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PIPX_HOME: ${{ github.workspace }}/.chatpulse-pipx/home
      PIPX_BIN_DIR: ${{ github.workspace }}/.chatpulse-pipx/bin
      PIPX_MAN_DIR: ${{ github.workspace }}/.chatpulse-pipx/man

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx test dependency
        run: python -m pip install pipx

      - name: Check shell installer
        if: runner.os == 'Linux'
        run: shellcheck docs/install.sh

      - name: Install and upgrade ChatPulse
        run: |
          bash docs/install.sh
          bash docs/install.sh
          "$PIPX_BIN_DIR/chatpulse" --version

      - name: Check website installer references
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("docs/index.html").read_text()
          expected = (
              "curl -fsSL https://chatpulse.online/install.sh | bash",
              "irm https://chatpulse.online/install.ps1 | iex",
          )
          missing = [command for command in expected if command not in page]
          if missing:
              raise SystemExit(f"Missing installer commands: {missing}")
          PY

  windows:
    name: Windows installer (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    env:
      PIPX_HOME: ${{ github.workspace }}\.chatpulse-pipx\home
      PIPX_BIN_DIR: ${{ github.workspace }}\.chatpulse-pipx\bin
      PIPX_MAN_DIR: ${{ github.workspace }}\.chatpulse-pipx\man

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipx test dependency
        shell: pwsh
        run: python -m pip install pipx

      - name: Install with Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          & ./docs/install.ps1
          Get-Command chatpulse -ErrorAction Stop
          & ./docs/install.ps1
          & (Join-Path $env:PIPX_BIN_DIR "chatpulse.exe") --version

      - name: Install with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          & ./docs/install.ps1
          Get-Command chatpulse -ErrorAction Stop
          & ./docs/install.ps1
          & (Join-Path $env:PIPX_BIN_DIR "chatpulse.exe") --version
